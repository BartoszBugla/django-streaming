databases:
  - name: streaming_db
    databaseName: streaming_db
    user: streaming_user
    plan: free

services:
  - type: web
    name: streaming-app
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn streaming.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: streaming_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
