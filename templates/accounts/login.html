{% extends "base.html" %}

{% block title %}Logowanie - StreamBox{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-12 mb-20">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white tracking-tight">Witaj z powrotem</h1>
        <p class="text-gray-400 mt-2">Zaloguj się, aby kontynuować oglądanie</p>
    </div>

    {% if error %}
    <div class="bg-red-900/30 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg mb-6 flex items-center gap-3">
        <svg class="w-5 h-5 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl p-8 border border-zinc-800/80 shadow-2xl space-y-6">
        {% csrf_token %}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        
        <div class="space-y-1">
            <label for="username" class="block text-sm font-medium text-gray-300">Nazwa użytkownika</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <input type="text" name="username" id="username" required
                       class="w-full bg-zinc-950/50 text-white rounded-xl pl-10 pr-4 py-3 border border-zinc-700/50 focus:border-red-500 focus:ring-1 focus:ring-red-500 focus:outline-none transition-colors">
            </div>
        </div>
        
        <div class="space-y-1">
            <label for="password" class="block text-sm font-medium text-gray-300">Hasło</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <input type="password" name="password" id="password" required
                       class="w-full bg-zinc-950/50 text-white rounded-xl pl-10 pr-4 py-3 border border-zinc-700/50 focus:border-red-500 focus:ring-1 focus:ring-red-500 focus:outline-none transition-colors">
            </div>
        </div>
        
        <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white py-3 rounded-xl font-semibold shadow-lg shadow-red-900/30 transition-all transform hover:-translate-y-0.5">
            Zaloguj się
        </button>
    </form>

    <p class="text-center text-gray-400 mt-8">
        Nie masz konta? <a href="{% url 'register' %}" class="text-red-400 hover:text-red-300 font-medium hover:underline transition-colors">Zarejestruj się za darmo</a>
    </p>
</div>

{% endblock %}
